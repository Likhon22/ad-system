_format_version: "3.0"

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods: [GET, POST, PUT, DELETE, OPTIONS]
      headers: [Authorization, Content-Type]
      credentials: true
      max_age: 3600

  - name: request-size-limiting
    config:
      allowed_payload_size: 1
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

services:
  - name: auth-service
    url: http://host.docker.internal:5000
    routes:
      - name: login
        paths: [/api/v1/auth/login]
        methods: [POST]
        plugins:
          - name: rate-limiting
            config: { minute: 10, policy: local }

      - name: register
        paths: [/api/v1/auth/register]
        methods: [POST]
        plugins:
          - name: rate-limiting
            config: { minute: 5, policy: local }

      - name: forgot-password
        paths: [/api/v1/auth/forget-password]
        methods: [POST]
        plugins:
          - name: rate-limiting
            config: { minute: 3, policy: local }

      - name: auth-general
        paths: [/api/v1/auth]
        strip_path: false
        plugins:
          - name: rate-limiting
            config: { minute: 60, policy: local }
